<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>故障文本生成器 · 黑川物流</title>
<style>
:root{color-scheme:light dark;--page:#f4f2ef;--surface:#fffefa;--field:#f8f6f3;--text:#26232b;--muted:#736d7c;--line:#e4dfe7;--purple:#715087;--purple-soft:#eee6f2;--button:#42334d;--button-text:#fff;--preview:#faf8f5;--success:#42664e;--warn:#895a1a;--shadow:0 18px 55px #2d163108}
@media(prefers-color-scheme:dark){:root{--page:#171619;--surface:#211f24;--field:#19181c;--text:#eeeaf0;--muted:#b1a9b8;--line:#39333f;--purple:#c4a2d6;--purple-soft:#352b3f;--button:#d9c3e6;--button-text:#251b2b;--preview:#1b191f;--success:#a1c5ac;--warn:#e4bd7c;--shadow:0 18px 55px #0002}}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,select,input[type=range],input[type=checkbox],summary{cursor:pointer}button{touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--purple);outline-offset:3px}button:disabled{opacity:.4;cursor:default}main{max-width:1120px;margin:0 auto;padding:32px 28px 30px}.brand{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.08em}.brand-symbol{display:grid;place-items:center;width:27px;height:27px;border:1px solid var(--line);border-radius:7px;color:var(--purple);font-size:17px;letter-spacing:0}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:24px 0 28px}h1{margin:0 0 7px;font-size:32px;line-height:1.3;letter-spacing:-.04em;font-weight:650}.intro p{margin:0;color:var(--muted)}.offline{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:12px;color:var(--muted)}.offline i{height:6px;width:6px;border-radius:50%;background:var(--success)}.workbench{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}.editor-panel{padding:23px}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}h2{font-size:15px;font-weight:600;margin:0}.quiet-actions{display:flex;align-items:center;gap:16px}.link-button{border:0;background:none;color:var(--muted);padding:5px 0;font-size:12px}.link-button:hover{color:var(--purple)}textarea{display:block;width:100%;border:1px solid var(--line);border-radius:9px;resize:vertical;padding:16px;background:var(--field);color:var(--text);line-height:1.9;min-height:180px;font-size:16px;overflow-wrap:anywhere}textarea::placeholder{color:var(--muted);opacity:.8}.editor-foot{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--muted);font-size:12px}.settings-panel{padding:23px;display:flex;flex-direction:column;gap:24px}.setting-label{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;font-weight:550;margin-bottom:10px}.setting-label output{font-size:12px;background:var(--purple-soft);color:var(--purple);border-radius:5px;padding:2px 7px;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}.setting-help{font-size:12px;color:var(--muted);margin:7px 0 0}select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text)}input[type=range]{width:100%;accent-color:var(--purple);display:block;margin:0;height:22px}.range-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:3px}.result-panel{margin-top:18px;overflow:hidden}.result-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 23px 0}.result-heading span{font-size:12px;color:var(--muted)}.preview{background:var(--preview);margin:17px 23px 0;border-radius:10px;padding:27px 26px;min-height:175px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:19px;line-height:2.7;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal}.preview.empty{font-family:inherit;font-size:14px;color:var(--muted);line-height:1.7;display:flex;align-items:center}.copy-section{padding:19px 23px 21px}.copy-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.copy-buttons{display:flex;gap:10px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:43px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:550;border:1px solid var(--line);background:var(--surface);color:var(--text)}.button:hover:not(:disabled){background:var(--field)}.button.primary{background:var(--button);color:var(--button-text);border-color:var(--button)}.button.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--button)}.copy-status{font-size:12px;color:var(--success);min-height:20px}.copy-help{color:var(--muted);font-size:12px;margin:12px 0 0}details{border-top:1px solid var(--line);padding:0 23px}summary{padding:14px 0;color:var(--muted);font-size:12px}.source-controls{display:flex;gap:6px;margin-bottom:12px}.source-controls button{padding:5px 13px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted)}.source-controls button[aria-pressed=true]{background:var(--purple-soft);border-color:var(--purple-soft);color:var(--purple)}#output{min-height:120px;max-height:350px;font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;margin-bottom:20px;white-space:pre-wrap}footer{display:flex;justify-content:space-between;gap:12px;margin-top:19px;color:var(--muted);font-size:11px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){main{padding:28px 18px}.intro{margin-top:20px;align-items:flex-start}.intro h1{font-size:27px}.offline{display:none}.workbench{grid-template-columns:1fr}.settings-panel{display:grid;grid-template-columns:1fr 1fr;gap:22px}.editor-panel,.settings-panel{padding:20px}.preview{margin:15px 20px 0;padding:22px 19px;font-size:18px}.result-heading{padding:19px 20px 0}.copy-section{padding:18px 20px}footer{flex-direction:column;gap:4px}}
@media(max-width:420px){main{padding:24px 12px}.editor-panel,.settings-panel{padding:17px}.quiet-actions{gap:12px}.copy-buttons{width:100%}.copy-buttons .button{flex:1;padding:10px 12px}.copy-row{align-items:flex-start}.result-heading span{font-size:11px}.preview{margin:14px 17px 0;padding:21px 16px}.copy-section{padding:17px}h1{font-size:26px}}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="brand-symbol" aria-hidden="true">≋</span><span>黑川物流 / 写作工具</span></div>
  <header class="intro">
    <div><h1>故障文本生成器</h1><p>让被改写的念头，留下看得见的痕迹。</p></div>
    <span class="offline"><i aria-hidden="true"></i>离线可用 · 本地处理</span>
  </header>
  <div class="workbench">
    <section class="panel editor-panel" aria-labelledby="input-heading">
      <div class="panel-heading"><h2 id="input-heading"><label for="input">输入原文</label></h2><button type="button" class="link-button" id="clear">清空</button></div>
      <textarea id="input" maxlength="30000" spellcheck="false" placeholder="把想要转换的文字粘贴到这里。"></textarea>
      <div class="editor-foot"><span>保留原有括号、标点和换行</span><span id="input-count">0 字</span></div>
    </section>
    <section class="panel settings-panel" aria-label="转换设置">
      <h2>效果设置</h2>
      <div><label class="setting-label" for="strength">故障强度 <output for="strength" id="strength-label">强烈</output></label><input id="strength" type="range" min="0" max="4" step="1" value="3" aria-valuetext="强烈"><div class="range-labels" aria-hidden="true"><span>正常</span><span>失真</span></div></div>
      <div><label class="setting-label" for="opacity">不透明度 <output for="opacity" id="opacity-label">75%</output></label><input id="opacity" type="range" min="0" max="100" step="1" value="75" aria-valuetext="75%"><div class="range-labels" aria-hidden="true"><span>透明</span><span>不透明</span></div></div>
    </section>
  </div>
  <section class="panel result-panel" aria-labelledby="result-heading">
    <div class="result-heading"><h2 id="result-heading">实时预览</h2><span id="result-caption">强烈 · 75% 不透明度</span></div>
    <div id="preview" class="preview" aria-label="故障文本实时预览"></div>
    <div class="copy-section"><div class="copy-row"><div class="copy-buttons"><button type="button" class="button primary" id="copy-html">复制 HTML · 含透明度 <span aria-hidden="true">↗</span></button><button type="button" class="button" id="copy-plain">复制纯文本</button></div><span id="copy-status" class="copy-status" role="status" aria-live="polite"></span></div><p class="copy-help">粘贴到 Obsidian 正文时，选 HTML 即可保留不透明度；纯文本仅保留故障字。</p></div>
    <details id="output-details"><summary>查看可复制结果</summary><div class="source-controls" role="group" aria-label="结果格式"><button type="button" id="show-html" aria-pressed="true">HTML</button><button type="button" id="show-plain" aria-pressed="false">纯文本</button></div><label for="output" class="sr-only">可复制结果</label><textarea id="output" readonly spellcheck="false"></textarea></details>
  </section>
  <footer><span>输入文字 → 调整效果 → 复制到正文</span><span>单文件工具 · 无需安装</span></footer>
  <noscript><p>请使用启用 JavaScript 的浏览器打开此文件。</p></noscript>
</main>
<script id="glitch-core">
/* Offline Unicode glitch core. No dependencies. */
(function (global) {
  'use strict';
  const ABOVE = ['\u035b', '\u035d', '\u033f', '\u033d', '\u031a', '\u0352'];
  const BELOW = ['\u0322', '\u0333', '\u0330', '\u0321', '\u031f', '\u031e'];
  const OVERLAY = ['\u0338', '\u0337'];
  const OWN = new Set([...ABOVE, ...BELOW, ...OVERLAY]);
  // The previously chosen manuscript effect used a wider pool. Remove those
  // extra marks only after Han characters; Latin accents/ogoneks stay intact.
  const LEGACY_HAN = new Set([...OWN, '\u0344', '\u0313', '\u0315', '\u0319', '\u0328', '\u032c', '\u0331', '\u0325']);
  const COUNTS = [0, 3, 6, 8, 12];
  const HAN = /\p{Script=Han}/u;
  const LATIN = /\p{Script=Latin}/u;
  const MARK = /\p{M}/u;
  const EMOJI = /[\p{Extended_Pictographic}\p{Regional_Indicator}\u20e3]/u;
  const segmenter = typeof Intl !== 'undefined' && Intl.Segmenter
    ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;

  function graphemes(text) {
    if (segmenter) return Array.from(segmenter.segment(text), item => item.segment);
    const result = [];
    for (const char of text) {
      const last = result.length - 1;
      const cp = char.codePointAt(0);
      if (last >= 0 && (MARK.test(char) || char === '\u200d' || result[last].endsWith('\u200d') ||
          (cp >= 0x1f3fb && cp <= 0x1f3ff) || (cp >= 0xe0020 && cp <= 0xe007f))) {
        result[last] += char;
      } else result.push(char);
    }
    return result;
  }

  function normalize(text) { return String(text == null ? '' : text).replace(/\r\n?/g, '\n'); }
  function eligible(cluster) { return !EMOJI.test(cluster) && (HAN.test(cluster) || LATIN.test(cluster)); }
  function clean(text) {
    return graphemes(normalize(text)).map(cluster => {
      if (!eligible(cluster)) return cluster;
      const pool = HAN.test(cluster) ? LEGACY_HAN : OWN;
      return Array.from(cluster).filter(char => !pool.has(char)).join('');
    }).join('');
  }
  function makePicker(text, strength) {
    // FNV-1a seed plus xorshift32: independent of opacity and previous calls.
    let state = 2166136261;
    const seed = strength + '\u0000' + text;
    for (let i = 0; i < seed.length; i++) state = Math.imul(state ^ seed.charCodeAt(i), 16777619) >>> 0;
    if (!state) state = 0x9e3779b9;
    return function (pool) {
      state ^= state << 13;
      state ^= state >>> 17;
      state ^= state << 5;
      return pool[(state >>> 0) % pool.length];
    };
  }
  function distort(text, strength) {
    const count = COUNTS[strength];
    const original = clean(text);
    const choose = makePicker(original, strength);
    return graphemes(original).map(cluster => {
      if (!count || !eligible(cluster)) return cluster;
      let marks = choose(OVERLAY);
      for (let i = 1; i < count; i++) marks += choose(i % 2 ? ABOVE : BELOW);
      return cluster + marks;
    }).join('');
  }
  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]))
      .replace(/\n/g, '<br>');
  }
  function boundedNumber(value, fallback, min, max) {
    if (value == null || value === '') return fallback;
    const number = Number(value);
    return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
  }
  function convert(input, options) {
    const opts = options || {};
    const text = normalize(input);
    const strength = Math.round(boundedNumber(opts.strength, 3, 0, 4));
    const opacity = Number((boundedNumber(opts.opacity, 75, 0, 100) / 100).toFixed(3));
    const plain = distort(text, strength);
    const segments = plain ? [{ text: plain, glitch: true }] : [];
    let html = plain ? '<span style="opacity: ' + opacity + ';">' + escapeHtml(plain) + '</span>' : '';
    if (/\t| {2}|(?:^|\n) | (?:\n|$)/.test(plain)) {
      html = '<span style="white-space: pre-wrap;">' + html + '</span>';
    }
    return { segments, plain, html, warnings: [] };
  }
  const api = Object.freeze({ convert, clean });
  global.GlitchText = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : window);

</script>
<script id="glitch-app">
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const input = $('input'), strength = $('strength'), opacity = $('opacity');
  const preview = $('preview'), output = $('output');
  const status = $('copy-status'), details = $('output-details');
  const levelNames = ['正常', '轻微', '明显', '强烈', '失真'];
  let result = {segments: [], plain: '', html: ''};
  let outputMode = 'html', composing = false, scheduled = 0, toastTimer = 0;
  const preferenceKey = 'kurokawa-glitch-preferences-v1';
  try {
    const saved = JSON.parse(localStorage.getItem(preferenceKey));
    if (saved && Number.isInteger(saved.strength) && saved.strength >= 0 && saved.strength <= 4) strength.value = saved.strength;
    if (saved && Number.isFinite(saved.opacity) && saved.opacity >= 0 && saved.opacity <= 100) opacity.value = saved.opacity;
  } catch (_) {}
  function preferences() {
    return {strength: Number(strength.value), opacity: Number(opacity.value)};
  }
  function updateSource() {
    output.value = outputMode === 'html' ? result.html : result.plain;
    $('show-html').setAttribute('aria-pressed', String(outputMode === 'html'));
    $('show-plain').setAttribute('aria-pressed', String(outputMode === 'plain'));
  }
  function update() {
    const options = preferences();
    result = GlitchText.convert(input.value, options);
    const nodes = result.segments.map(segment => {
      const span = document.createElement('span');
      span.textContent = segment.text;
      span.style.opacity = String(options.opacity / 100);
      return span;
    });
    preview.replaceChildren(...nodes);
    preview.classList.toggle('empty', !input.value);
    if (!input.value) preview.textContent = '输入文字后，结果会显示在这里。';
    $('input-count').textContent = `${Array.from(GlitchText.clean(input.value)).length.toLocaleString('zh-CN')} 字`;
    $('strength-label').textContent = levelNames[options.strength];
    strength.setAttribute('aria-valuetext', levelNames[options.strength]);
    $('opacity-label').textContent = `${options.opacity}%`;
    opacity.setAttribute('aria-valuetext', `${options.opacity}%`);
    $('result-caption').textContent = `${levelNames[options.strength]} · ${options.opacity}% 不透明度`;
    $('copy-html').disabled = !result.plain;
    $('copy-plain').disabled = !result.plain;
    status.textContent = '';
    updateSource();
  }
  function queueUpdate() {
    cancelAnimationFrame(scheduled);
    if (!composing) scheduled = requestAnimationFrame(update);
  }
  function saveOptions() {
    try {localStorage.setItem(preferenceKey, JSON.stringify(preferences()));} catch (_) {}
    update();
  }
  input.addEventListener('compositionstart', () => {composing = true;});
  input.addEventListener('compositionend', () => {composing = false; queueUpdate();});
  input.addEventListener('input', queueUpdate);
  [strength, opacity].forEach(control => control.addEventListener('input', saveOptions));
  $('clear').addEventListener('click', () => {input.value = ''; update(); input.focus();});
  $('show-html').addEventListener('click', () => {outputMode = 'html'; updateSource();});
  $('show-plain').addEventListener('click', () => {outputMode = 'plain'; updateSource();});
  async function copy(mode) {
    cancelAnimationFrame(scheduled);
    update();
    const text = mode === 'html' ? result.html : result.plain;
    if (!text) return;
    let copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {await navigator.clipboard.writeText(text); copied = true;}
    } catch (_) {}
    if (!copied) {
      const previousFocus = document.activeElement;
      const helper = document.createElement('textarea');
      helper.value = text;
      helper.setAttribute('readonly', '');
      helper.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
      document.body.appendChild(helper);
      helper.select();
      helper.setSelectionRange(0, text.length);
      try {copied = document.execCommand('copy');} catch (_) {}
      helper.remove();
      if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus({preventScroll: true});
    }
    clearTimeout(toastTimer);
    if (copied) {
      status.textContent = mode === 'html' ? '已复制，粘贴到正文即可' : '已复制纯文本';
      toastTimer = setTimeout(() => {status.textContent = '';}, 4000);
    } else {
      outputMode = mode;
      updateSource();
      details.open = true;
      output.focus();
      output.select();
      status.textContent = '请按 ⌘C / Ctrl+C 复制已选中的结果';
    }
  }
  $('copy-html').addEventListener('click', () => copy('html'));
  $('copy-plain').addEventListener('click', () => copy('plain'));
  update();
})();

</script>
</body>
</html>
